name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            test-results/visual-*.png
            test-results/search-*.png
            test-results/profile-*.png
            test-results/recommendations-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish browser assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JS_FILE="$(basename "$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' ! -name '*.map' | head -n 1)")"
          CSS_FILE="$(basename "$(find dist/assets -maxdepth 1 -type f -name 'index-*.css' | head -n 1)")"
          printf '{"js":"%s","css":"%s","sha":"%s"}\n' "$JS_FILE" "$CSS_FILE" "$GITHUB_SHA" > dist/latest.json
          rm -f dist/assets/*.map
          # The existing stable Vercel loader references these compatibility names.
          # Keep them pointing at the exact current production bundle on every release.
          cp "dist/assets/$CSS_FILE" dist/assets/index-Cqt5wARO.css
          cp "dist/assets/$JS_FILE" dist/assets/index-Donq7OuA.js
          rm -rf /tmp/starshiy-brat-deploy
          mkdir -p /tmp/starshiy-brat-deploy
          cp -R dist/. /tmp/starshiy-brat-deploy/
          cd /tmp/starshiy-brat-deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy-assets
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          touch .nojekyll
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push --force origin deploy-assets
